on:
  push:
    tags: 'v*'

jobs:
  release-create:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set Env
      run: |
        echo "RELEASE_NAME=${GITHUB_REF_NAME} / $(git show -s --format=%cs)" >> ${GITHUB_ENV}
    - name: Create Release
      run: gh release create "${GITHUB_REF_NAME}" --title "${{ env.RELEASE_NAME }}" --generate-notes --draft
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
  release-matrix:
    name: Release Go Binary
    needs: [release-create]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: "linux", goarch: "amd64",   arch: "x64",     goarm: "" }
          - { goos: "linux", goarch: "386",     arch: "x86",     goarm: "" }
          - { goos: "linux", goarch: "arm64",   arch: "arm64v8", goarm: "" }
          - { goos: "linux", goarch: "arm",     arch: "arm32v7", goarm: "7" }
          - { goos: "linux", goarch: "arm",     arch: "arm32v6", goarm: "6" }
          - { goos: "linux", goarch: "riscv64", arch: "riscv64", goarm: "" }
    steps:
    - uses: actions/checkout@v4
    - name: Set Env
      run: |
        echo "PACKAGE_NAME=icmp-exporter-${{ matrix.goos }}-${{ matrix.arch }}" >> ${GITHUB_ENV}
        echo "VERSION_STRING=$(git show -s --format=%cs) ${GITHUB_REF_NAME} ${GITHUB_SHA}" >> ${GITHUB_ENV}
    - name: Build Release
      run: |
        docker run --rm \
        -v "$(pwd):/workspace" -w /workspace \
        -e PACKAGE_NAME="${{ env.PACKAGE_NAME }}" \
        -e FLAGS="-X 'main.versionString=${{ env.VERSION_STRING }}'" \
        -e CGO_ENABLED=0 \
        -e GOOS=${{ matrix.goos }} \
        -e GOARCH=${{ matrix.goarch }} \
        -e GOARM="${{ matrix.goarm }}" \
        -e GOFLAGS="-buildvcs=false" \
        golang:1.27.4-bookworm \
        .github/build.sh
    - name: Upload Release
      run: gh release upload "${GITHUB_REF_NAME}" "${{ env.PACKAGE_NAME }}.tar.gz"
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
